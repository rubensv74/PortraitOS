<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>PortraitOS Sprint 7 Runner</title></head>
<body>
<pre id="out">RUNNING</pre>
<iframe id="app" src="../app/index.html" hidden></iframe>
<script>
"use strict";
(() => {
    const lines = [];
    let failed = false;
    let step = "boot";
    let failureError = null;
    let failureAudit = null;
    const out = document.getElementById("out");
    const iframe = document.getElementById("app");

    function pass(label, detail = "") { lines.push(`PASS ${label}${detail ? ` — ${detail}` : ""}`); }
    function fail(label, detail = "") { failed = true; lines.push(`FAIL ${label}${detail ? ` — ${detail}` : ""}`); }
    function check(condition, label, detail = "") { condition ? pass(label, detail) : fail(label, detail); }
    function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    async function waitFor(predicate, timeout = 20000) {
        const start = Date.now();
        while (Date.now() - start < timeout) {
            try { if (predicate()) return true; } catch (_) {}
            await wait(100);
        }
        return false;
    }

    function buildReadinessAudit(win) {
        try {
            const profile = win.ProfileService?.getActive?.() || null;
            const photos = Array.isArray(profile?.identity?.photos) ? profile.identity.photos : [];
            const evidence = profile && win.ProfileIdentity?.getEvidenceState
                ? win.ProfileIdentity.getEvidenceState(profile)
                : null;
            let validation = null;
            let validationException = null;
            try {
                validation = profile && win.ProfileValidation?.validateForPrompt
                    ? win.ProfileValidation.validateForPrompt(profile)
                    : null;
            } catch (error) {
                validationException = {
                    code: error?.code || error?.name || "ERROR",
                    message: error?.message || String(error)
                };
            }
            return {
                profileId: profile?.id || null,
                profileName: profile?.name || null,
                photoCount: photos.length,
                primaryCount: photos.filter(photo => photo?.isPrimary === true).length,
                sources: photos.map(photo => ({
                    id: photo?.id || null,
                    sourceDataUrl: Boolean(photo?.source?.dataUrl),
                    sourceBinaryId: Boolean(photo?.source?.binaryId),
                    thumbnailDataUrl: Boolean(photo?.thumbnail?.dataUrl),
                    thumbnailBinaryId: Boolean(photo?.thumbnail?.binaryId),
                    checksum: Boolean(photo?.checksum)
                })),
                identity: {
                    status: profile?.identity?.status || null,
                    locked: profile?.identity?.locked === true,
                    completeness: Number(profile?.identity?.validation?.completeness || 0),
                    evidenceScore: Number(evidence?.score || 0),
                    evidenceReady: evidence?.readyForLock === true,
                    primaryForEvidence: evidence?.hasPrimaryPhoto === true,
                    criticalMissing: evidence?.criticalMissingSections || [],
                    invalidEvidenceCount: Number(evidence?.invalidEvidenceCount || 0)
                },
                direction: {
                    objective: profile?.direction?.objective || null,
                    format: profile?.direction?.format || null,
                    status: profile?.direction?.status || null,
                    expression: profile?.direction?.pose?.expression || null,
                    wardrobeStyle: profile?.direction?.wardrobe?.style || null,
                    garmentCount: Array.isArray(profile?.direction?.wardrobe?.garments)
                        ? profile.direction.wardrobe.garments.length
                        : 0
                },
                validation: validation ? {
                    ready: validation.ready === true,
                    valid: validation.valid === true,
                    errorCodes: (validation.errors || []).map(item => item?.code).filter(Boolean),
                    warningCodes: (validation.warnings || []).map(item => item?.code).filter(Boolean)
                } : null,
                validationException
            };
        } catch (error) {
            return {
                auditException: {
                    code: error?.code || error?.name || "ERROR",
                    message: error?.message || String(error)
                }
            };
        }
    }

    async function send() {
        const status = failed ? "failed" : "passed";
        lines.push(`SUMMARY ${failed ? "FAIL" : "PASS"}`);
        const text = lines.join("\n");
        out.textContent = text;
        await fetch("/results", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                status,
                step,
                text,
                errorCode: failureError?.code || failureError?.name || null,
                errorMessage: failureError?.message || null,
                audit: failureAudit
            })
        });
    }

    async function verifyReloadPersistence(win, originalId, demoId) {
        step = "demo-reload";
        await win.ProfileStorage?.flush?.();
        const reloadFrame = document.createElement("iframe");
        reloadFrame.hidden = true;
        document.body.appendChild(reloadFrame);
        const loaded = new Promise(resolve => reloadFrame.addEventListener("load", resolve, { once: true }));
        reloadFrame.src = `../app/index.html?demo-reload=${Date.now()}`;
        await loaded;
        const reloadWin = reloadFrame.contentWindow;
        const reloadDoc = reloadFrame.contentDocument;
        check(await waitFor(() => reloadDoc.documentElement.getAttribute("data-portraitos-ready") === "true"), "demo reload app ready");
        check(await waitFor(() => Boolean(reloadWin.DemoModeService)), "demo reload service available");
        const state = reloadWin.ProfileManager.getState();
        check(state.profiles.some(profile => profile.id === demoId), "reload conserva perfil demo");
        check(state.profiles.some(profile => profile.id === originalId), "reload conserva perfil real");
        reloadFrame.remove();
    }

    iframe.addEventListener("load", async () => {
        const win = iframe.contentWindow;
        const doc = iframe.contentDocument;
        let reportedFailureStep = null;
        try {
            step = "app-ready";
            check(await waitFor(() => doc.documentElement.getAttribute("data-portraitos-ready") === "true"), "app ready");

            step = "release-service";
            check(Boolean(win.ReleaseMetadata), "ReleaseMetadata global");
            check(Boolean(win.ReleaseMetadataBinding), "ReleaseMetadataBinding global");
            check(await waitFor(() => doc.documentElement.getAttribute("data-release-metadata-ready") === "true"), "release metadata initialized");
            check(Boolean(doc.querySelector("[data-release-version]")), "release version visible");
            check(Boolean(doc.querySelector("[data-release-details]")), "release details visible");

            step = "orientation";
            check(Boolean(win.PromptOrientationBinding), "PromptOrientationBinding global");
            check(await waitFor(() => doc.querySelector("[data-step-panel='prompt']")?.getAttribute("data-prompt-orientation-ready") === "true"), "orientation initialized");
            const nav = doc.querySelector("[data-prompt-orientation]");
            check(Boolean(nav), "orientation nav present");
            check((nav?.querySelectorAll("[data-prompt-orientation-target]").length || 0) === 4, "orientation has four areas");
            ["generate", "history", "export", "review"].forEach(id => check(Boolean(nav?.querySelector(`[data-prompt-orientation-target='${id}']`)), `orientation ${id}`));

            step = "metadata-contract";
            const metadata = await win.ReleaseMetadata.load({ force: true });
            check(metadata.version === "1.0.0-rc.1", "RC1 version", metadata.version);
            check(metadata.storageVersion === 2, "storage version", String(metadata.storageVersion));
            check(metadata.channel === "rc", "release channel", metadata.channel);

            step = "orientation-idempotency";
            const before = doc.querySelectorAll("[data-prompt-orientation]").length;
            win.PromptOrientationBinding.init();
            const after = doc.querySelectorAll("[data-prompt-orientation]").length;
            check(before === 1 && after === 1, "orientation init idempotent");

            step = "demo-contract";
            check(Boolean(win.DemoModeService), "DemoModeService global");
            check(Boolean(win.DemoModeBinding), "DemoModeBinding global");
            check(await waitFor(() => doc.documentElement.getAttribute("data-demo-mode-ready") === "true"), "Demo Mode initialized");
            check(Boolean(doc.querySelector("[data-demo-mode-controls]")), "Demo Mode controls visible");

            const original = win.ProfileService.getActive();
            const originalSnapshot = JSON.stringify(original);
            check(Boolean(original?.id), "perfil real inicial disponible");

            step = "demo-prepare";
            const progress = [];
            let lastUsefulDemoStage = "demo-prepare";
            let demo;
            try {
                demo = await win.DemoModeService.prepare({
                    onProgress: (stage, message) => {
                        progress.push(`${stage}:${message || ""}`);
                        if (stage !== "error") {
                            lastUsefulDemoStage = `demo-${stage}`;
                            step = lastUsefulDemoStage;
                        }
                    }
                });
            } catch (error) {
                reportedFailureStep = lastUsefulDemoStage;
                step = reportedFailureStep;
                failureError = error;
                failureAudit = buildReadinessAudit(win);
                fail("demo prepare runtime exception", `${error?.code || error?.name || "ERROR"}: ${error?.message || String(error)}`);
                throw error;
            }

            step = "demo-verify";
            check(demo.profileName === win.DemoModeService.DEMO_NAME, "demo profile named");
            check(demo.photoCount === 5, "demo tiene cinco fotos", String(demo.photoCount));
            check(demo.evidence?.readyForLock === true, "demo evidencia válida", String(demo.evidence?.score));
            check(demo.identityLocked === true, "demo identity locked");
            check(demo.direction?.status === "ready", "demo direction ready", demo.direction?.status || "");
            check(demo.readiness?.ready === true, "demo validation ready", String(demo.readiness?.score));
            check(demo.historyCount === 1, "demo una entrada history", String(demo.historyCount));
            check(Boolean(demo.generation?.generationId), "demo generationId");
            check(demo.exportResult?.package?.schema === "portraitos.export-package", "demo package exportable");
            const demoId = demo.profileId;

            step = "demo-isolation";
            win.ProfileManager.select(original.id);
            const realAfterDemo = win.ProfileService.getActive();
            check(JSON.stringify(realAfterDemo) === originalSnapshot, "perfil real no alterado");
            win.ProfileManager.select(demoId);

            step = "demo-idempotency";
            const historyBeforeReuse = win.PromptHistoryService.list({ profileId: demoId, limit: 100 }).items.length;
            const reused = await win.DemoModeService.prepare();
            const historyAfterReuse = win.PromptHistoryService.list({ profileId: demoId, limit: 100 }).items.length;
            check(reused.reused === true, "segunda ejecución reutiliza demo");
            check(historyBeforeReuse === historyAfterReuse && historyAfterReuse === 1, "segunda ejecución no duplica history", String(historyAfterReuse));

            await verifyReloadPersistence(win, original.id, demoId);

            step = "demo-cleanup";
            win.ProfileManager.select(demoId);
            const removed = win.DemoModeService.remove();
            check(removed.removed === true, "demo eliminada");
            const finalState = win.ProfileManager.getState();
            check(!finalState.profiles.some(profile => profile.id === demoId), "demo no permanece en library");
            check(finalState.profiles.some(profile => profile.id === original.id), "perfil real permanece tras cleanup");

            step = "complete";
        } catch (error) {
            if (reportedFailureStep) step = reportedFailureStep;
            else fail("runtime exception", error?.stack || error?.message || String(error));
        }
        await send();
    }, { once: true });
})();
</script>
</body>
</html>
