<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>PortraitOS Sprint 3 tests</title></head>
<body><pre id="results" data-test-status="running">RUNNING</pre><script>
"use strict";
const output = document.getElementById("results"); const results = []; const keepAlive = setInterval(() => {}, 50);
function record(name, condition, detail="") { results.push({name, passed: condition === true, detail}); render(); if (!condition) throw new Error(`${name}: ${detail}`); }
function render(final=false) { const passed=results.filter(x=>x.passed).length; output.textContent=results.map(x=>`${x.passed?"PASS":"FAIL"} ${x.name}${x.detail?` — ${x.detail}`:""}`).join("\n"); if(final){clearInterval(keepAlive); output.dataset.testStatus=passed===results.length?"passed":"failed"; output.textContent+=`\nSUMMARY ${passed}/${results.length}`;} }
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const frame=document.createElement("iframe"); frame.src="../app/index.html"; document.body.append(frame);
frame.addEventListener("load", async()=>{ const w=frame.contentWindow; try { if(!w.document.documentElement.hasAttribute("data-portraitos-ready")) return;
    for(let attempt=0; attempt<100 && w.ProfileStorage.describe().backend==="uninitialized"; attempt+=1) await wait(20);
    record("A fachada inicializada", w.ProfileStorage.describe().backend !== "uninitialized");
    record("A IndexedDB primario", ["indexeddb","indexeddb-pending","localstorage"].includes(w.ProfileStorage.describe().backend));
    record("A contrato completo", ["save","load","remove","exists","migrate","exportData","importData","backup","restore","flush"].every(k=>typeof w.ProfileStorage[k]==="function"));
    const initial=w.ProfileService.getActive(); record("B perfil activo disponible", Boolean(initial?.id));
    w.ProfileService.update({description:"Sprint 3 persisted"}); w.ProfileManager.saveActive(); await w.ProfileStorage.flush();
    record("B flush confirma", w.ProfileStorage.describe().pending===false);
    const library=w.ProfileStorage.loadLibrary(); const stored=library.profiles.find(p=>p.id===initial.id);
    record("C metadatos storage", stored.storageVersion==="2.0.0" && Boolean(stored.schemaVersion));
    record("C timestamps", Boolean(stored.createdAt) && Boolean(stored.updatedAt));
    record("C historial migración", Array.isArray(stored.migrationHistory));
    const backup=await w.ProfileStorage.backup(); const parsed=JSON.parse(backup);
    record("D backup versionado", parsed.format==="portraitos-backup" && Boolean(parsed.checksum));
    record("D backup incluye perfil", parsed.library.profiles.some(p=>p.id===initial.id));
    w.ProfileService.update({description:"Changed after backup"}); w.ProfileManager.saveActive(); await w.ProfileStorage.flush();
    await w.ProfileStorage.restore(backup); record("E restore recupera contenido", w.ProfileStorage.loadLibrary().profiles.find(p=>p.id===initial.id).description==="Sprint 3 persisted");
    let checksum=false; try { const bad=JSON.parse(backup); bad.library.profiles[0].name="tampered"; await w.ProfileStorage.restore(bad); } catch(e){ checksum=e.code==="STORAGE_CHECKSUM"; }
    record("F checksum rechaza corrupción", checksum);
    record("F rollback conserva versión", w.ProfileStorage.loadLibrary().profiles.find(p=>p.id===initial.id).description==="Sprint 3 persisted");
    w.ProfileManager.create({name:"Persistence B"}); w.ProfileService.identity.updateGeneral({summary:"Identidad persistida"}); w.ProfileManager.saveActive(); await w.ProfileStorage.flush();
    record("G múltiples perfiles", w.ProfileStorage.loadLibrary().profiles.length>=2);
    record("H Identity integrada", JSON.stringify(w.ProfileStorage.loadLibrary().profiles).includes("Identidad persistida"));
    record("H Photos integrada", w.ProfileStorage.loadLibrary().profiles.some(p=>Array.isArray(p.identity?.photos)));
    const exported=await w.ProfileStorage.exportData(); record("I export/import simétrico", JSON.parse(exported).checksum===JSON.parse(backup).checksum || JSON.parse(exported).format==="portraitos-backup");
    record("I estrategia Photos actualizada", w.PhotoStorage.describe().strategy==="profile-storage-facade-v2");
    record("J sin writes pendientes", !w.ProfileStorage.describe().pending);
    render(true);
} catch(error){ results.push({name:"runner",passed:false,detail:error.stack||error.message}); render(true); } });
</script></body></html>
