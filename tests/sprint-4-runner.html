<!doctype html><html lang="es"><head><meta charset="utf-8"><title>PortraitOS Sprint 4 tests</title></head>
<body><pre id="results" data-test-status="running">RUNNING</pre><script>
"use strict";
const out=document.getElementById("results"),results=[],keep=setInterval(()=>{},50); const wait=ms=>new Promise(r=>setTimeout(r,ms));
function render(final=false){const pass=results.filter(x=>x.pass).length;out.textContent=results.map(x=>`${x.pass?"PASS":"FAIL"} ${x.name}${x.detail?` — ${x.detail}`:""}`).join("\n");if(final){clearInterval(keep);out.dataset.testStatus=pass===results.length?"passed":"failed";out.textContent+=`\nSUMMARY ${pass}/${results.length}`;}}
function check(name,value,detail=""){results.push({name,pass:value===true,detail});render();if(!value)throw new Error(`${name}: ${detail}`);}
function imageFile(w){const c=w.document.createElement("canvas");c.width=640;c.height=640;const x=c.getContext("2d");x.fillStyle="#6d4aff";x.fillRect(0,0,640,640);const b=w.atob(c.toDataURL("image/png").split(",")[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new w.File([a],"synthetic-s4.png",{type:"image/png"});}
const frame=document.createElement("iframe");frame.src="../app/index.html";document.body.append(frame);
frame.addEventListener("load",async()=>{const w=frame.contentWindow;try{if(!w.document.documentElement.hasAttribute("data-portraitos-ready"))return;await w.ProfileStorage.ready();
  const errors=[];w.addEventListener("error",e=>errors.push(e.message));w.addEventListener("unhandledrejection",e=>errors.push(String(e.reason)));
  check("A backend listo",w.ProfileStorage.getStatus().backend==="indexeddb");
  const imported=await w.PhotosBinding.addFiles([imageFile(w)]);check("A Data URL transitoria",imported.added[0].source.dataUrl.startsWith("data:"));
  await w.ProfileStorage.flush();const aggregate=w.ProfileStorage.loadLibrary();
  check("A agregado sin Data URLs",!JSON.stringify(aggregate).includes("data:image"));
  const photo=aggregate.profiles.find(p=>p.id===w.ProfileService.getActive().id).identity.photos[0];check("A referencias binarias",Boolean(photo.source.binaryId&&photo.thumbnail.binaryId));
  const original=await w.ProfileStorage.binary.get(photo.source.binaryId);check("A original Blob",original.blob instanceof w.Blob);check("A checksum conservado",original.checksum===photo.checksum);

  const stableName=aggregate.profiles[0].name;w.ProfileStorage.configureForTests({quotaLimit:1});w.ProfileService.update({name:"No debe confirmar"});w.ProfileManager.saveActive();let quota=false;try{await w.ProfileStorage.flush();}catch(e){quota=e.code==="STORAGE_QUOTA";}check("B cuota rechazada",quota);check("B rollback conserva versión",w.ProfileStorage.loadLibrary().profiles[0].name===stableName);w.ProfileStorage.configureForTests({quotaLimit:null});await w.ProfileStorage.flush();check("B recovery tras liberar cuota",w.ProfileStorage.getStatus().journalState==="clean");

  w.ProfileStorage.wizard.save("s4.wizard","wizard");w.ProfileStorage.knowledge.save("s4.knowledge","knowledge");w.ProfileStorage.history.save("s4.history",{entries:[1]});w.ProfileStorage.review.save("s4.review",{reviews:{}});await w.ProfileStorage.flush();check("D Wizard fachada",w.ProfileStorage.wizard.load("s4.wizard")==="wizard");check("D Knowledge fachada",w.ProfileStorage.knowledge.load("s4.knowledge")==="knowledge");check("D History fachada",JSON.parse(w.ProfileStorage.history.load("s4.history")).entries.length===1);check("D Review fachada",Boolean(JSON.parse(w.ProfileStorage.review.load("s4.review")).reviews));check("D storage.js delegado",w.PortraitStorage.isStorageAvailable()===true);

  const backup=await w.ProfileStorage.backup(),pack=JSON.parse(backup);check("E manifest integral",pack.manifest.profiles>=1&&pack.manifest.binaries>=2&&pack.manifest.consumers>=4);check("E binarios exportados",pack.binaries.every(x=>x.dataUrl.startsWith("data:")));await w.ProfileStorage.restore(backup);check("E restore validado",w.ProfileStorage.loadLibrary().profiles.length===pack.library.profiles.length);

  const owner=w.ProfileStorage.loadLibrary().profiles[0].id,orphanId=`${owner}:orphan:original`;await w.ProfileStorage.binary.put({binaryId:orphanId,profileId:owner,photoId:"orphan",kind:"original",blob:new w.Blob(["x"],{type:"text/plain"})});const integrity=await w.ProfileStorage.validateIntegrity();check("F binarios aislados por propietario",(await w.ProfileStorage.binary.list()).every(item=>Boolean(item.profileId)));check("G huérfano reportado",integrity.orphanedRecords.some(x=>x.code==="orphan_binary"));check("G no borrado silencioso",await w.ProfileStorage.binary.exists(orphanId));

  const before=w.ProfileStorage.loadLibrary().profiles[0].description;w.ProfileStorage.configureForTests({failPoint:"mid_transaction"});w.ProfileService.update({description:"interrupted"});w.ProfileManager.saveActive();let aborted=false;try{await w.ProfileStorage.flush();}catch(e){aborted=e.code==="STORAGE_WRITE_FAILED";}check("C aborto intermedio detectado",aborted);check("C estado anterior recuperado",w.ProfileStorage.loadLibrary().profiles[0].description===before);w.ProfileStorage.configureForTests({reset:true,mode:"auto",failPoint:null,indexedDBAvailable:true});await w.ProfileStorage.init();check("C journal resuelto",w.ProfileStorage.getStatus().journalState==="clean"&&w.ProfileStorage.loadLibrary().profiles[0].description===before);

  w.ProfileStorage.configureForTests({reset:true,mode:"localstorage",indexedDBAvailable:true});await w.ProfileStorage.init();check("H fallback forzado",w.ProfileStorage.getStatus().backend==="localstorage");
  w.ProfileStorage.configureForTests({reset:true,mode:"indexeddb",indexedDBAvailable:false});let required=false;try{await w.ProfileStorage.init();}catch(e){required=e.code==="INDEXEDDB_REQUIRED";}check("I indexeddb falla explícito",required);
  w.ProfileStorage.configureForTests({reset:true,mode:"auto",indexedDBAvailable:false});await w.ProfileStorage.init();check("J auto degrada",w.ProfileStorage.getStatus().backend==="localstorage"&&w.ProfileStorage.getStatus().degraded);
  check("sin errores runtime",errors.length===0,errors.join(" | "));render(true);
}catch(e){results.push({name:"runner",pass:false,detail:e.stack||e.message});render(true);}});
</script></body></html>
